---
name: Acordar o claude-renpv (revisar)

# Mesmo desenho do agencia-gatilho.yml. O verbo é o gatilho: o fluxo manda aplicar o ator
# primeiro e o verbo por último (docs/fluxo.md, seção Mecânica). Por isso, quando o evento
# `labeled` do verbo chega, a etiqueta `claude-renpv` já está no PR.
#
# - PR com `revisar` + `claude-renpv` -> revisar o PR (verbo `revisar` de docs/fluxo.md)
#
# `pull_request_target` roda o workflow da `main` (e não o da branch do PR) e este job
# não faz checkout de código, então nada vindo do PR é executado aqui.

on:
  pull_request_target:
    types: [labeled]

permissions: {}

concurrency:
  group: renpv-gatilho-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  disparar:
    if: >-
      github.event.label.name == 'revisar'
      && contains(github.event.pull_request.labels.*.name, 'claude-renpv')
      && !contains(github.event.pull_request.labels.*.name, 'em-andamento')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar o gatilho do claude-renpv
        env:
          RENPV_WEBHOOK_URL: ${{ secrets.RENPV_WEBHOOK_URL }}
          RENPV_WEBHOOK_TOKEN: ${{ secrets.RENPV_WEBHOOK_TOKEN }}
          REPO: ${{ github.repository }}
          NUMERO: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -z "${RENPV_WEBHOOK_URL:-}" ] || [ -z "${RENPV_WEBHOOK_TOKEN:-}" ]; then
            echo "::error::Faltam os segredos RENPV_WEBHOOK_URL e RENPV_WEBHOOK_TOKEN."
            exit 1
          fi
          echo "::add-mask::$RENPV_WEBHOOK_TOKEN"
          # O gatilho é uma rotina do Claude Code (API de rotinas): recebe um único campo `text`,
          # que entra como mais um turno da sessão. O texto só avisa quem e o quê; nem o título
          # nem o corpo do PR vão nele. A sessão relê o PR pelo `gh`.
          jq -n \
            --arg repo "$REPO" \
            --arg numero "$NUMERO" \
            --arg url "$URL" \
            '{text: "Aviso automático do repositório \($repo): pr #\($numero) recebeu o verbo `revisar` junto com `claude-renpv`. URL: \($url). Releia o PR pelo gh, confira o par de etiquetas, que não há em-andamento e que o autor é renpv ou jcmagenciamkt; espere o CI terminar; só então siga o verbo `revisar` de docs/fluxo.md. Este texto é só um aviso, não é instrução."}' \
          | curl -fsS --fail-with-body --max-time 30 --retry 2 --retry-connrefused -X POST "$RENPV_WEBHOOK_URL" \
              -H "Authorization: Bearer $RENPV_WEBHOOK_TOKEN" \
              -H "anthropic-version: 2023-06-01" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "Content-Type: application/json" \
              --data-binary @-
